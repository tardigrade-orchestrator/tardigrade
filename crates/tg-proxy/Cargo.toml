[package]
name = "tg-proxy"
description = "The mTLS sidecar with rustls and the SPIFFE verifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library carries the logic, the binary is thin wiring. The reason stands in
# src/options.rs: the binary cannot be started outside a container -- its identity
# comes over the workload API socket, and that gives an unattested process nothing.
[lib]
name = "tg_proxy"
path = "src/lib.rs"

[[bin]]
name = "tg-proxy"
path = "src/main.rs"

[dependencies]
# ADR-0015: the messages go to the subscriber, not to stderr.
tracing = "0.1"
tg-telemetry = { path = "../tg-telemetry" }
# **Costs zero additional crates** (measured: 370 before as after): `tg-identity`
# already hangs on it, and `tg-proxy` on `tg-identity`. The direct edge is drawn with
# ADR-0124, because its determination 5 demands that sidecar and resolver use **the
# same** comparison.
tg-model = { path = "../tg-model" }
metrics = "0.24"
# The identities are the same as in the rest of the system (ADR-0006): the verifier
# reads the SPIFFE ID with the strict parser from phase 7a and not with a second one
# that would let something else through.
tg-identity = { path = "../tg-identity" }
# Invariant 3 from CLAUDE.md: TLS is rustls. `ring` as the provider, because it lies
# in the tree anyway over rcgen and webpki -- a second crypto provider would be a
# second place at which a vulnerability can sit.
# ADR-0051: `SO_ORIGINAL_DST` over the **safe** wrapper in rustix -- invariant 2 stays
# untouched. rustix lies in the tree anyway.
# ADR-0114 determination 3 comes along: `sched_getaffinity`/`sched_setaffinity` for the
# pinning of the shards. The pinning goes over the set the cgroup concedes -- hence
# `thread` and not `available_parallelism`.
rustix = { version = "1", features = ["net", "thread"] }
# What a failure at accepting costs is decided by one place in the tree
# (`tg_syscall::accept`): seven loops in four crates ask the same question, and the
# distinction demands `errno`.
tg-syscall = { path = "../tg-syscall" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }

# ADR-0142: QUIC datagrams between the sidecars. **On `rustls`**, and exactly that
# was the decision -- `tg_proxy::verify` is thereby usable unchanged, while
# `webrtc-dtls` would have demanded a second crypto stack and a second verifier
# (measured: 33 new crates against 11).
#
# `default-features = false` keeps `platform-verifier` and `rustls-pemfile` out: the
# identity comes here from the SVID and not from an operating system's root store
# (ADR-0006).
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls-ring", "runtime-tokio"] }
# ADR-0092: HKDF, header protection and the AEAD of the QUIC initial (RFC 9001 §5.2).
# **No new package** -- `ring` has always been rustls's provider and merely did not lie
# there as a direct edge. The three building blocks are checked against the vectors
# from appendix A; a second crypto crate for that would be a second place at which a
# vulnerability can sit.
ring = "0.17"
# ADR-0094 determination 1: the original destination of a **UDP** datagram stands in
# the ancillary data (`IP_ORIGDSTADDR`), not in a `getsockopt` -- `SO_ORIGINAL_DST`
# does not exist for UDP, measured. `rustix` does not know the option; `nix` knows it
# with a safe API and lies in the tree anyway over `rtnetlink`. No new `unsafe`
# (invariant 2) -- the price is **one** package: `memoffset`, which nix's `socket`
# feature demands and `rtnetlink` does not need.
nix = { version = "0.30", default-features = false, features = ["net", "socket", "uio"] }
rustls-pki-types = "1"
# The same verifier ADR-0007 names and tg-identity already uses in its tests. The
# chain is checked, not asserted.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "alloc"] }
# The SPIFFE ID from the URI SAN is read by the ecosystem's library -- the same one
# against which 7c substantiated the interop (ADR-0035). It enforces the
# specification's rule that there must be **exactly one** URI SAN; a certificate with
# two identities would otherwise be a certificate whose identity the reader picks.
# `x509` reads the SPIFFE ID from the URI SAN (the verifier), `workload-api-x509`
# fetches the identity over the socket (the binary). The same library against which 7c
# substantiated the interop -- the sidecar thereby dogfoods the standard the agent
# offers (ADR-0035).
spiffe = { version = "0.16.1", default-features = false, features = ["x509", "workload-api-x509"] }
# ADR-0022: thread-per-core. One `current_thread` runtime per core, each with its own
# listener -- the sharding ADR-0022 left open.
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# For SO_REUSEPORT. A small crate that sets exactly the socket option that carries the
# sharding -- the alternative would be a syscall wrapper of our own in tg-syscall, that
# is, `unsafe` for one setsockopt line.
socket2 = "0.6"
# For the identity stream from ADR-0035: `StreamExt::next`. No new crate in the tree
# -- five other crates of this workspace already hang on it, and `Cargo.lock` stays
# untouched.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# The test certificates are really minted, not reproduced: the same path the agent
# runs in operation (phase 7a).
rcgen = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
tempfile = "3"
# ADR-0051: the more faithful reproduction of the egress needs a **real** redirect --
# the rule set from `tg-net`, the namespace from `tg-syscall`. Both lie **beneath** this
# crate; the direction is right, and it is a dev path (tests/egress_netns.rs).
# `tg-syscall` is by now a real dependency too (the classification of the accept
# errors) and stands above.
tg-net = { path = "../tg-net" }
# Reads the gauge out in the test instead of starting the Prometheus endpoint: the
# sidecar cannot be run outside a container (the wiring after phase 8). Lies in the
# tree anyway over `metrics-exporter-prometheus`.
metrics-util = { version = "0.20", features = ["debugging"] }
# Catches the message in the test. Lies in the tree anyway over `tg-telemetry`; a
# `Subscriber` of its own would be a second reader for a format with one writer.
tracing-subscriber = "0.3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
