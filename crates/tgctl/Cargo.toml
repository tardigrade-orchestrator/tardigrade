[package]
name = "tgctl"
description = "Command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tg-admin = { path = "../tg-admin" }
tg-defs = { path = "../tg-defs" }
# ADR-0095: `tgctl secret keygen` produces the data key, and `tgctl` seals with
# it (determination 4) -- the plaintext never reaches the control plane. **Zero
# new packages**: `tg-identity` lies in the tree via `tgd` anyway.
tg-identity = { path = "../tg-identity" }
tg-model = { path = "../tg-model" }
serde_json = { workspace = true }
tg-runtime = { path = "../tg-runtime" }
tg-telemetry = { path = "../tg-telemetry" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# ADR-0137: **only** in the test rig. The witnesses build their archives with
# the real writer; `tgctl` is delivered without the consensus core -- the bill of
# materials (ADR-0134) does not count development dependencies.
tg-consensus = { path = "../tg-consensus" }
http = "1"
tempfile = "3"
# Only for the manual guard: it holds the number of format breaks against
# `session::PROTOCOL_FIELDS` (ADR-0072). It is counted **there**, at the source
# -- two counts would be two opportunities to count differently.
tg-store = { path = "../tg-store" }
tg-wire = { path = "../tg-wire" }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true, features = ["codegen", "server", "transport"] }
tower = { version = "0.5", features = ["util"] }
