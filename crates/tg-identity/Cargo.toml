[package]
name = "tg-identity"
description = "SPIFFE server, workload API and SVID issuance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The shared JSON codec of the internal paths (PLAN: "a small, shared crate is
# missing here"). It lies **beneath** this crate.
tg-wire = { path = "../tg-wire" }
# So that a refusal reaches not only the caller but the operator too: the answer
# to the container is deliberately coarse (see `refusal`), and the reason died at
# this place until then.
tracing = "0.1"
# ADR-0053: the attestation hangs on a **handle**, not on a number.
# `SO_PEERPIDFD` is not wrapped by `rustix`; the one `unsafe` place is tg-syscall.
tg-syscall = { path = "../tg-syscall" }
tg-telemetry = { path = "../tg-telemetry" }
metrics = "0.24"
# ADR-0087: base64 comes from the crate instead of from our own hand. No new
# package -- `tg-net` has used the same one since the underlay (ADR-0039); one edge
# comes along.
base64 = "0.22"
# ADR-0095: the data key's AEAD (ChaCha20-Poly1305). **No new package** -- `ring`
# is the crypto provider `rustls` and `rcgen` run in this tree anyway (invariant 3),
# and it is already a dev dependency here; one edge comes along.
ring = "0.17"
pem = "3"
rcgen = { workspace = true }
# ADR-0014: threshold signing as the signing CA's custody model (phase 7b).
frost-ed25519 = { workspace = true }
rand_core = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
# ADR-0035: the standardized SPIFFE workload API. `tonic` lies in the tree anyway
# since ADR-0002; new are solely `prost` and `tonic-prost` -- the protobuf encoding.
# The codegen tools (protox, tonic-prost-build) stand in the `xtask` and do not
# appear here: the product is checked in.
tonic = { workspace = true }
# ADR-0134: the signing group's seat list dials a seat (ADR-0097). It lay in `tgd`,
# and `tgctl signer repair` therefore linked the consensus core. All three already
# lay here in the development path.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic-prost = "=0.14.6"
prost = "0.14"
# `workload.proto` imports google/protobuf/struct.proto (for the claims in
# `ValidateJWTSVIDResponse`). The type is never used -- the JWT half answers
# UNIMPLEMENTED --, but it stands in the contract and must be compilable.
prost-types = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# For the SPIFFE server's client (ADR-0037) -- the same layer as the workload API
# server beside it. `bytes` and `serde_json` have become dispensable here with the
# shared codec (`tg-wire`).
http = "1"
# ADR-0043: the credential on the cluster transports. `rustls` is invariant 3;
# `x509-parser` lies in the tree anyway over rcgen's feature `x509-parser` and reads
# the SPKI without ASN.1 having to arise here by hand.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
x509-parser = "0.18"
# Reads the SPIFFE ID from the URI SAN -- the second opinion beside the strict
# parser from phase 7a, the same discipline as in `tg_proxy::verify`. Until ADR-0043
# the crate was only a dev dependency (the foreign client from 7c); `x509` is the
# feature that serves the verifier.
spiffe = { version = "0.16.1", default-features = false, features = ["x509", "workload-api-x509"] }

# Only for the tests: really verify the chain instead of asserting it.
# `rustls-webpki` lies in the tree anyway over rustls and is the same verifier the
# data plane will use in phase 8 (ADR-0007).
# For the Unix socket's accept stream (`workload_api::incoming`): it answers
# `accept`'s failure itself and needs a loop that can wait for that. Lies in the tree
# anyway over four crates of this workspace; `Cargo.lock` stays untouched.
futures-util = { version = "0.3", default-features = false }

# **The name facet, one source.** `tg_model::names` carries the form from
# `schema/workload.xsd` -- it stood here twice rebuilt by hand (`attest.rs`,
# `id.rs`), and what hangs on it is the identity boundary: whoever raises the facet
# gets a name the ingest accepts and the attestation refuses. The direction is right
# (`tg-model` does not know `tg-identity`), and **zero new packages**: `tg-model`
# pulls only `tg-defs`, `ipnet` and `serde`, and all three lie in the tree anyway
# over `tgd`/`tg-agent`. The same argument as at `tg-net` -> `tg-model` in
# ADR-0069.
tg-model = { path = "../tg-model" }

[dev-dependencies]
# Only for the tests any more: the codec that needed it lies in `tg-wire`.
# ADR-0006: the container the attestation happens at is started from **our** bundle
# and not from a hand-written one -- otherwise the test would check a spec that does
# not exist in operation. Both lie beneath `tg-identity`, the direction is right
# (`tg-runtime` does not know `tg-identity`).
tg-runtime = { path = "../tg-runtime" }
# Reads the metric out in the test instead of starting the Prometheus endpoint
# (ADR-0079). The same rationale and the same version as in `tg-proxy`; it lies in
# the tree anyway over `metrics-exporter-prometheus`.
metrics-util = { version = "0.20", features = ["debugging"] }
tg-defs = { path = "../tg-defs" }
tar = "0.4"
# `mesh_container` runs two real sidecar containers in **one** namespace and lets
# them speak mTLS with each other -- for that the namespace and the rule set from
# 9b/ADR-0060 are needed. The direction is right: `tg-net` does not know
# `tg-identity`.
tg-net = { path = "../tg-net" }
# Catches the message in the test -- as in `tg-proxy`. Lies in the tree anyway over
# `tg-telemetry`.
tracing-subscriber = "0.3"
serde_json = { workspace = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "alloc"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time"] }
tempfile = "3"
# The fuzz run reads the SPKI back out of the damaged leaf in order to check the
# invariant -- with the same parser the verifier uses.
x509-parser = "0.18"
# ADR-0043: the handshake is substantiated at real sockets, not asserted -- the same
# yardstick as in phase 8b. `ring` expressly (the finding from 10d).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The acceptance demands that an **ordinary** Ed25519 verifier take the group
# signature. So it is checked with one that knows nothing of FROST -- `ring`, the same
# verifier that works under rustls/webpki.
ring = "0.17"
# For the two calls that deliberately behave wrongly (without the header, JWT): they
# need a raw channel over the Unix socket.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
