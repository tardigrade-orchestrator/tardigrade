[package]
name = "tg-dst"
description = "Deterministic simulation tests: the in-process bus and the scenarios (ADR-0005, ADR-0032)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The bus is a test rig, no product code: it hangs on tg-consensus, not the other
# way round. ADR-0023 -- what lies here is in no delivery binary.
[dependencies]
tg-consensus = { path = "../../crates/tg-consensus" }
# The report is sealed with **the same** chain as the audit trail (ADR-0020,
# phase 11a) -- not with a second one of its own.
tg-telemetry = { path = "../../crates/tg-telemetry" }
openraft = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# `test-util` gives the controlled time (`start_paused`). It stands in the
# dev-dependencies because only the scenarios need it -- the bus itself does not
# compute with the clock, it only sleeps.
[dev-dependencies]
tokio = { workspace = true, features = [
  "rt",
  "macros",
  "time",
  "sync",
  "test-util",
] }
